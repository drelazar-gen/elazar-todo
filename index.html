<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Elazar — To-Do List</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Password gate -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Elazar — To-Do List</h1>
      <p class="login-sub">Enter password to continue</p>
      <form id="login-form">
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="submit">Unlock</button>
      </form>
      <p id="login-error" class="login-error"></p>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <header class="app-header">
      <div>
        <h1>To-Do List</h1>
        <div id="updated-label" class="updated-label"></div>
      </div>
      <div class="header-actions">
        <button id="show-completed-toggle" class="ghost-btn">Show completed</button>
        <button id="logout-btn" class="ghost-btn">Log out</button>
      </div>
    </header>

    <main id="sections-container" class="sections-container"></main>

    <button id="add-fab" class="add-fab" title="Add item">+</button>
  </div>

  <!-- Add / edit modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">Add item</h2>
      <label>Section</label>
      <input list="section-list" id="field-section" placeholder="e.g. NEEDS ACTION TODAY / THIS WEEK" />
      <datalist id="section-list"></datalist>

      <label>Title</label>
      <textarea id="field-text" rows="2" placeholder="What needs to happen?"></textarea>

      <label>Details (optional)</label>
      <textarea id="field-meta" rows="2" placeholder="Extra context, amounts, dates..."></textarea>

      <label>Link (optional)</label>
      <input type="url" id="field-link" placeholder="https://..." />

      <label class="checkbox-row">
        <input type="checkbox" id="field-urgent" />
        Urgent
      </label>

      <div class="modal-actions">
        <button id="modal-delete" class="danger-btn hidden">Delete</button>
        <div class="modal-actions-right">
          <button id="modal-cancel" class="ghost-btn">Cancel</button>
          <button id="modal-save" class="primary-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
